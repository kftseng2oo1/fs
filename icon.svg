<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="40%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#5a3a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0d0500"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="249" fill="none" stroke="#c9a84c" stroke-width="5"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#8b6914" stroke-width="3"/>

  <!-- 8 direction tick marks -->
  <line x1="256" y1="13"  x2="256" y2="46"  stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="426" y1="86"  x2="405" y2="107" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="499" y1="256" x2="466" y2="256" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="426" y1="426" x2="405" y2="405" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="499" x2="256" y2="466" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="86"  y1="426" x2="107" y2="405" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="13"  y1="256" x2="46"  y2="256" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  <line x1="86"  y1="86"  x2="107" y2="107" stroke="#8b6914" stroke-width="3" stroke-linecap="round"/>

  <!-- Needle body (pointing North/up) -->
  <polygon points="256,92 242,256 270,256 256,296" fill="url(#needleGrad)" filter="url(#glow)"/>

  <!-- Crown base band -->
  <rect x="230" y="120" width="52" height="18" rx="4" fill="#c9a84c"/>

  <!-- Crown left spike -->
  <polygon points="234,120 228,80 244,100" fill="#c9a84c"/>

  <!-- Crown centre spike (tallest) -->
  <polygon points="256,120 248,52 264,52" fill="#ffe08a"/>

  <!-- Crown right spike -->
  <polygon points="278,120 284,80 268,100" fill="#c9a84c"/>

  <!-- Crown jewel left -->
  <circle cx="238" cy="116" r="6" fill="#ffe08a"/>

  <!-- Crown jewel centre -->
  <circle cx="256" cy="113" r="7" fill="#fff8d0"/>

  <!-- Crown jewel right -->
  <circle cx="274" cy="116" r="6" fill="#ffe08a"/>

  <!-- Needle tail -->
  <polygon points="256,296 249,270 263,270" fill="rgba(201,168,76,0.4)"/>

  <!-- Hub centre -->
  <circle cx="256" cy="256" r="16" fill="#ffe08a" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#0d0500"/>
  <circle cx="256" cy="256" r="5"  fill="#c9a84c"/>
</svg>
